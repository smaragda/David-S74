<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení obsluhy | s74.cz</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="fonts/fonts.css?v=20260805">
    <link rel="stylesheet" href="app.css">
</head>
<body class="page-shell page-shell--centered">
<main class="layout">
    <section class="panel panel--narrow">
        <p class="eyebrow">Interní systém</p>
        <h1>Vstup pro baristy.</h1>
        <p class="lead lead--compact">Pro validaci voucherů se prosím přihlaste svými údaji.</p>

        <form class="stacked-form" action="staff-redeem.html" method="get">
            <label>
                Uživatelské jméno
                <input type="text" name="username" value="obsluha" required>
            </label>
            <label>
                Heslo
                <input type="password" name="password" placeholder="••••••••" required autofocus>
            </label>

            <div style="margin-top: 12px; display: grid; gap: 8px;">
                <button type="submit" class="primary-button">Přihlásit se</button>
                <a href="vouchery.html" class="ghost-link">Zpět na web</a>
            </div>
        </form>
    </section>
</main>
<footer class="legal-footer microcopy"><a href="soukromi.html">Soukromí a cookies</a></footer>
</body>
</html>
