<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokladna | s74.cz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body class="page-shell page-shell--centered">
<main class="layout">
    <section class="panel panel--narrow">
        <p class="eyebrow">Shrnutí objednávky</p>
        <h1>Skvělá volba!</h1>
        
        <div class="detail-card">
            <p class="offer-price">1 000 Kč</p>
            <h2 id="offer-name">Voucher v hodnotě 1 000 Kč</h2>
            <p class="microcopy">Tento voucher lze využít na cokoli z aktuální nabídky s74 do hodnoty uvedené částky.</p>
        </div>

        <form class="stacked-form" action="order-success.html" method="get">
            <label>
                Váš e-mail
                <input type="email" name="email" placeholder="jan.novak@priklad.cz" required autofocus>
                <span class="microcopy">Na tento e-mail vám voucher doručíme ihned po zaplacení.</span>
            </label>

            <div style="margin-top: 12px; display: grid; gap: 8px;">
                <button type="submit" class="primary-button">Zaplatit kartou</button>
                <a href="vouchery.html" class="ghost-link">Změnit výběr</a>
            </div>
        </form>

        <p class="microcopy" style="margin-top: 24px; text-align: center;">
            Platba probíhá bezpečně přes šifrovanou bránu <strong>Stripe</strong>.
        </p>
    </section>
</main>
</body>
</html>
