<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Vedoucí – hledání')}"></head>
<body class="page-shell page-shell--top">
<header th:replace="~{fragments/base :: topbar(${user})}"></header>
<main>
    <section class="panel panel--admin">
        <p class="eyebrow">Vedoucí</p>
        <h1 class="h1--compact">Hledání voucheru</h1>
        <nav th:replace="~{fragments/base :: adminnav}"></nav>
        <p class="flash flash--error" th:if="${error}" th:text="${error}"></p>
        <p class="flash flash--info" th:if="${info}" th:text="${info}"></p>

        <form class="stacked-form" th:action="@{/admin/vouchers}" method="get">
            <label>
                Kód voucheru, e-mail zákazníka nebo číslo objednávky
                <input type="text" name="q" th:value="${q}" autocomplete="off" autofocus placeholder="např. jana@example.com nebo 7F3A9C21">
            </label>
            <button type="submit" class="primary-button">Hledat</button>
        </form>

        <p class="notice" th:if="${searched and #lists.isEmpty(rows)}">Nic nenalezeno.</p>

        <div class="table-wrap" th:if="${!#lists.isEmpty(rows)}">
            <table class="data-table">
                <thead><tr><th>Objednávka</th><th>E-mail</th><th>Hodnota</th><th>Stav</th><th>Platí do</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td class="mono" th:text="${r.orderRef}">7F3A9C21</td>
                    <td th:text="${r.email}">jana@example.com</td>
                    <td th:text="${r.view.amount}">1 000 Kč</td>
                    <td><span class="badge" th:classappend="${r.view.badgeClass}" th:text="${r.view.statusLabel}">Platný</span></td>
                    <td th:text="${r.view.validUntil}">4. 11. 2027</td>
                    <td><a class="small-button" th:href="@{/admin/vouchers/{id}(id=${r.id})}">Detail</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
