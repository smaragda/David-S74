spring:
  application:
    name: s74-voucher-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

s74:
  frontend-base-url: ${S74_FRONTEND_BASE_URL:http://localhost:8000}
  voucher:
    allowed-amounts-czk: 500,1000,2000
    redemption-mode: one-time
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    from: ${S74_MAIL_FROM:}
