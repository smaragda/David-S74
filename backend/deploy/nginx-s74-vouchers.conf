# nginx server blok pro backend voucherů. NEPOUŽITÝ PODKLAD (F8) – před nasazením upravte `server_name`.
# Umístění: /etc/nginx/sites-available/s74-vouchers.conf + symlink do sites-enabled/.
# Certifikát vystaví certbot (`certbot --nginx -d vouchery.s74.cz`), který doplní/aktualizuje řádky ssl_*.

# Limity na úrovni nginx (druhá vrstva za limity v aplikaci). Zóny patří do kontextu http.
limit_req_zone $binary_remote_addr zone=s74_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=s74_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vouchery.s74.cz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vouchery.s74.cz;

    ssl_certificate     /etc/letsencrypt/live/vouchery.s74.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vouchery.s74.cz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # Actuator (health) je jen pro localhost – zvenku se nepouští.
    location /actuator {
        deny all;
        return 403;
    }

    # Kód voucheru je v cestě → nesmí se dostat do access logu.
    location /staff/v/ {
        access_log off;
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }

    location = /login {
        limit_req zone=s74_login burst=10 nodelay;
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }

    location /api/public/ {
        limit_req zone=s74_api burst=30 nodelay;
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }

    # Webhooky (platforma, Connect, v2 události účtů): podpis ověřuje aplikace.
    # Volitelně omezit na IP adresy Stripe (https://docs.stripe.com/ips).
    location /api/stripe/ {
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }

    # Hostované stránky podniků: výsledek platby má v adrese session_id (krátce zobrazuje voucher) → bez access logu.
    location ~ ^/v/[^/]+/hotovo$ {
        access_log off;
        limit_req zone=s74_api burst=30 nodelay;
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }

    location /v/ {
        limit_req zone=s74_api burst=30 nodelay;
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/s74-vouchers-proxy.conf;
    }
}
